server {
    listen 80;
    listen [::]:80;
    server_name zoidbergcoin.com www.zoidbergcoin.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zoidbergcoin.com www.zoidbergcoin.com;

    root /var/www/zoidbergchain;
    index index.html;

    client_max_body_size 5M;

    # Certbot will manage these certificate paths after issuance.
    ssl_certificate /etc/letsencrypt/live/zoidbergcoin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zoidbergcoin.com/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
